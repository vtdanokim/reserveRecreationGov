# ============================================================
# Goose Point Campground - Recreation.gov Booking Bot Config
# ============================================================

recreation_gov:
  # Campground ID from the URL: recreation.gov/camping/campgrounds/233687
  campground_id: "233687"
  campground_name: "Goose Point Campground"

  # Your recreation.gov login credentials
  email: "your_email@example.com"
  password: "your_password_here"

booking:
  # Desired check-in and check-out dates (YYYY-MM-DD)
  checkin_date: "2025-06-01"
  checkout_date: "2025-06-03"

  # Number of people in your party
  num_people: 2

filters:
  # Only book sites on this loop (case-insensitive match, e.g. "C" matches "Loop C")
  # Leave blank ("") to allow any loop.
  loop: "C"

  # Only book sites whose "Max Vehicle Length" attribute is >= this value (feet).
  # Set to 0 to skip this filter.
  min_vehicle_length_ft: 30

timing:
  # Reservations open at 10:00 AM Eastern Time
  release_hour: 10
  release_minute: 0
  release_second: 0
  timezone: "America/New_York"

  # How many seconds before release to start the pre-flight (login, page load)
  preflight_seconds: 120

  # How many seconds before release to begin API polling
  poll_start_seconds: 2

  # Polling interval in seconds once we're in the hot window
  poll_interval_seconds: 0.3

  # Maximum seconds to keep polling after release before giving up
  poll_timeout_seconds: 60

browser:
  # Browser to use: "chromium", "firefox", or "webkit"
  browser_type: "chromium"

  # Run browser visibly (false) or in background (true)
  # Recommended: false so you can see what's happening and intervene if needed
  headless: false

  # Slow down each Playwright action by this many ms (useful for debugging)
  slow_mo: 0

notifications:
  # Play a sound when a site is found / booked
  sound_alert: true

  # Print verbose status updates to the console
  verbose: true
